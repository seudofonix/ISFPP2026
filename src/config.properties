# ---- Origen de los datos: bd (PostgreSQL, ver jdbc.properties) o archivo
origen=bd
usuario=src/archivos/usuarios.txt
servicio=src/archivos/servicios.txt
vehiculo=src/archivos/vehiculos.txt

# ---- Motor de rutas (GraphHopper) y mapa vial. El extracto .osm va en mapas/ (no se descarga al ejecutar)
rutas.motor=graphhopper
rutas.osm=mapas/puerto_madryn_ampliado.osm
rutas.cache=mapas/graphhopper-cache-madryn-ampliado

# ---- Area de simulacion (debe estar dentro del extracto .osm) y ajuste a calle
latitud1=-42.832
latitud2=-42.704
longitud1=-65.126
longitud2=-65.005
ajuste.tolerancia.metros=200

# ---- Mapa inicial
ciudad.nombre=Puerto Madryn
mapa.centro.latitud=-42.785
mapa.centro.longitud=-65.070
mapa.zoom=12

# ---- Estimacion de la duracion (cotizacion comercial)
velocidad.media.kmh=40

# simulacion de viajes (todos los valores deben ser mayores que 0)
simulacion.segundos.tramo=4.0
simulacion.pasos.tramo=10
simulacion.espera.maxima.segundos=60
simulacion.capacidad.cola=50
simulacion.maximo.conductores=3