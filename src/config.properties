# ---- Origen de los datos. Cambiar solo esta linea para elegir de donde se cargan usuarios, vehiculos y servicios:
#        origen=bd       -> base de datos PostgreSQL (conexion en jdbc.properties, raiz del proyecto)
#        origen=archivo  -> archivos de texto indicados abajo (usuario, servicio, vehiculo)
#      Despues de cambiarlo hay que reiniciar la aplicacion (o volver a ejecutar para que Maven copie el archivo).
origen=bd
# ---- Interfaz de usuario y idioma. Reiniciar la aplicacion despues de cambiarlos:
#        ui=fx       -> ventanas JavaFX con mapa
#        ui=consola  -> menus por consola (sin JavaFX)
ui=fx
#        idioma=es | en  (tambien se puede cambiar en pantalla desde el ingreso)
idioma=es

usuario=src/archivos/usuarios.txt
servicio=src/archivos/servicios.txt
vehiculo=src/archivos/vehiculos.txt

# ---- Motor de rutas (GraphHopper) y mapa vial. El extracto .osm va en mapas/ (no se descarga al ejecutar)
rutas.motor=graphhopper
rutas.osm=mapas/puerto_madryn_ampliado.osm
rutas.cache=mapas/graphhopper-cache-madryn-ampliado

# ---- Area de simulacion (debe estar dentro del extracto .osm) y ajuste a calle
latitud1=-42.832
latitud2=-42.704
longitud1=-65.126
longitud2=-65.005
ajuste.tolerancia.metros=200

# ---- Mapa inicial
ciudad.nombre=Puerto Madryn
mapa.centro.latitud=-42.785
mapa.centro.longitud=-65.070
mapa.zoom=12

# ---- Estimacion de la duracion (cotizacion comercial)
velocidad.media.kmh=40

# ---- Simulacion de viajes (todos los valores deben ser mayores que 0)
#      simulacion.segundos.tramo      demora simulada del tramo origen -> destino (tambien es lo que tarda el
#                                     marcador del conductor en recorrerlo en el mapa). Define la velocidad: el
#                                     tramo conductor -> origen se recorre a ESA MISMA velocidad, asi que dura
#                                     proporcional a su distancia (conductor lejos = mas demora)
#      simulacion.pasos.tramo         pasos en que se divide cada tramo
#      simulacion.espera.maxima.segundos  tiempo maximo que un viaje espera a que un conductor lo acepte
#      simulacion.capacidad.cola      viajes que entran en la bandeja de cada conductor
#      simulacion.maximo.conductores  conductores simulados (se eligen para cubrir todos los servicios)
simulacion.segundos.tramo=4.0
simulacion.pasos.tramo=10
simulacion.espera.maxima.segundos=60
simulacion.capacidad.cola=50
simulacion.maximo.conductores=3